<title>Hoy tenemos · Biga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* ══════════════════════════════════════════════════════════════
   HOY TENEMOS · A5 · blanco y negro
   Lee las filas "Hoy Tenemos" del mismo Google Sheet que la carta QR.
   ══════════════════════════════════════════════════════════════ */
@page { size: A5 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e6e6e1; color: #000; font-family: Barlow, sans-serif; }

.toolbar {
  max-width: 559px; margin: 20px auto 12px; padding: 0 4px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  font-size: 14px;
}
.toolbar button {
  font: 700 15px "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase;
  background: #000; color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; min-height: 44px;
}
.toolbar button:hover { background: #333; }
.toolbar .info { color: #333; }
.avisos { max-width: 559px; margin: 0 auto 12px; padding: 0 4px; }
.aviso { background: #fff3cd; border: 1px solid #c99a00; color: #5c4400; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
.aviso.error { background: #fde2e1; border-color: #b3261e; color: #6b0f0a; }

.hoja {
  width: 559px; height: 794px; margin: 0 auto 40px; background: #fff;
  padding: 28px 32px 24px; display: flex; flex-direction: column; justify-content: space-between;
  overflow: hidden; box-shadow: 0 2px 14px rgba(0,0,0,.18);
}
.cabecera { display: flex; flex-direction: column; gap: 16px; }
.logo { height: 58px; width: auto; display: block; align-self: flex-start; }
.titulo {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  border-bottom: 2px solid #000; padding-bottom: 8px; margin-top: 18px;
}
.titulo h1 { margin: 0; font: 800 50px/0.9 "Barlow Condensed", sans-serif; text-transform: uppercase; }
.titulo span { font-size: 12.5px; color: #333; text-align: right; padding-bottom: 2px; }

.lista { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 14px 0; gap: var(--group-gap); overflow: hidden; }
.grupo { display: flex; gap: 14px; align-items: flex-start; }
.grupo + .grupo { border-top: 1px solid #9a9a9a; padding-top: var(--group-gap); }
.grupo h2 { width: 92px; flex-shrink: 0; margin: 0; padding-top: 3px; font: 700 13px "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; }
.platos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--item-gap); }
.plato .linea { display: flex; align-items: baseline; gap: 8px; }
.plato .nombre, .plato .precio { font: 700 var(--name)/1.1 "Barlow Condensed", sans-serif; letter-spacing: .03em; }
.plato .nombre { text-transform: uppercase; }
.plato .precio { font-weight: 600; white-space: nowrap; }
.plato p { margin: 1px 0 0; font-size: var(--desc); line-height: 1.3; color: #333; }
.vacio { text-align: center; color: #555; font-size: 15px; }

.pie { display: flex; align-items: center; justify-content: space-between; gap: 14px; border-top: 1px solid #000; padding-top: 10px; }
.pie p { margin: 0; font-size: 12px; line-height: 1.35; color: #333; max-width: 250px; }
.pie .qr { display: flex; align-items: center; gap: 9px; }
.pie .qr div { text-align: right; display: flex; flex-direction: column; gap: 2px; }
.pie .qr strong { font: 700 13px "Barlow Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.pie .qr span { font-size: 12px; color: #333; }
.pie .qr img { width: 64px; height: 64px; display: block; }

@media print {
  html, body { background: #fff; }
  .toolbar, .avisos { display: none !important; }
  .hoja { margin: 0; box-shadow: none; width: 148mm; height: 210mm; }
}
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIGURACIÓN — la MISMA URL CSV que usa index.html
// ══════════════════════════════════════════════════════════════
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpHjogF1GUnfKXb6pkjSZfBaT8SCZ-Rv6vK2oaDiBW5jgJNL5i-S_Xt87XrWH-WlKU3_w3qNyvgIBc/pub?gid=2045283716&single=true&output=csv";
const MAX_PLATOS = 10;
// ══════════════════════════════════════════════════════════════

// Orden fijo de la carta
const FAMILIAS = [
  { id: "antipasti", etiqueta: "Antipasti", claves: ["antipasti", "antipasto", "entrante", "entrantes"] },
  { id: "piadina",   etiqueta: "Piadina",   claves: ["piadina", "piadinas", "piadine"] },
  { id: "pasta",     etiqueta: "Pasta",     claves: ["pasta", "pasta fresca", "pastas", "risotto", "arroz"] },
  { id: "pizza",     etiqueta: "Pizza",     claves: ["pizza", "pizzas", "pizza napoletana"] },
  { id: "dolci",     etiqueta: "Dolci",     claves: ["postre", "postres", "dolci", "dolci della casa"] }
];

// Si la columna "Familia" está vacía, se deduce por palabras del plato (se avisa en pantalla)
const DEDUCIR = [
  ["dolci",  ["cremoso", "ricotta", "ricota", "chocolate", "bizcocho", "arroz con leche", "tarta", "helado", "gelato", "tiramis", "panna", "sorbete", "flan", "mousse", "semifrio", "cheesecake"]],
  ["pizza",  ["pizza", "calzone"]],
  ["piadina",["piadina", "sandwich", "sándwich"]],
  ["pasta",  ["pasta", "canelon", "lasana", "lasaña", "ravioli", "risotto", "arroz", "orecchiette", "rigatoni", "casarecce", "puntalette", "spaghett", "espaguet", "tagliatell", "gnocchi", "ñoqui", "noqui", "tortellini", "pappardelle", "macarron", "fettucc", "linguine", "paccheri"]]
];

const NIVELES = [
  { name: 23, desc: 14,   item: 12, group: 14 },
  { name: 21, desc: 13.5, item: 10, group: 12 },
  { name: 19, desc: 13,   item: 8,  group: 10 },
  { name: 18, desc: 12.5, item: 7,  group: 9 },
  { name: 17, desc: 12,   item: 5,  group: 7 },
  { name: 16, desc: 12,   item: 4,  group: 6 }
];

const $ = (id) => document.getElementById(id);
const normal = (s) => String(s ?? "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function parseCSV(texto) {
  const filas = []; let fila = []; let celda = ""; let comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) {
      if (c === '"') { if (texto[i + 1] === '"') { celda += '"'; i++; } else { comillas = false; } }
      else { celda += c; }
    } else if (c === '"') { comillas = true; }
    else if (c === ",") { fila.push(celda); celda = ""; }
    else if (c === "\n") { fila.push(celda); filas.push(fila); fila = []; celda = ""; }
    else if (c !== "\r") { celda += c; }
  }
  if (celda !== "" || fila.length) { fila.push(celda); filas.push(fila); }
  return filas;
}

function precio(valor) {
  let p = String(valor ?? "").trim().replace(/€/g, "").trim();
  if (!p) return "";
  if (/^\d+(\.\d+)?$/.test(p)) {
    const n = Number(p);
    p = Number.isInteger(n) ? String(n) : String(n).replace(".", ",");
  }
  return p;
}

function familiaDe(valorColumna, nombre, descripcion) {
  const v = normal(valorColumna);
  if (v) {
    const f = FAMILIAS.find((f) => f.claves.some((k) => normal(k) === v));
    if (f) return { id: f.id, deducida: false, desconocida: false };
    return { id: null, deducida: false, desconocida: true, valor: valorColumna };
  }
  const texto = normal(nombre + " " + descripcion);
  for (const [id, palabras] of DEDUCIR) {
    if (palabras.some((w) => texto.includes(normal(w)))) return { id, deducida: true, desconocida: false };
  }
  return { id: "antipasti", deducida: true, desconocida: false };
}

function avisar(texto, error) {
  const d = document.createElement("div");
  d.className = "aviso" + (error ? " error" : "");
  d.textContent = texto;
  $("avisos").appendChild(d);
}

function pintar(platos) {
  const lista = $("lista");
  lista.innerHTML = "";
  if (!platos.length) {
    lista.innerHTML = '<p class="vacio">No hay platos en "Hoy Tenemos".<br>Rellena el nombre en el Google Sheet.</p>';
    return;
  }
  for (const fam of FAMILIAS) {
    const delGrupo = platos.filter((p) => p.familia === fam.id);
    if (!delGrupo.length) continue;
    const g = document.createElement("div"); g.className = "grupo";
    const h = document.createElement("h2"); h.textContent = fam.etiqueta; g.appendChild(h);
    const cont = document.createElement("div"); cont.className = "platos";
    for (const p of delGrupo) {
      const el = document.createElement("div"); el.className = "plato";
      const linea = document.createElement("div"); linea.className = "linea";
      const n = document.createElement("span"); n.className = "nombre"; n.textContent = p.nombre;
      const pr = document.createElement("span"); pr.className = "precio"; pr.textContent = p.precio;
      linea.append(n, pr); el.appendChild(linea);
      if (p.descripcion) { const d = document.createElement("p"); d.textContent = p.descripcion; el.appendChild(d); }
      cont.appendChild(el);
    }
    g.appendChild(cont); lista.appendChild(g);
  }
}

function ajustar() {
  const lista = $("lista");
  const hoja = $("hoja");
  for (const nv of NIVELES) {
    hoja.style.setProperty("--name", nv.name + "px");
    hoja.style.setProperty("--desc", nv.desc + "px");
    hoja.style.setProperty("--item-gap", nv.item + "px");
    hoja.style.setProperty("--group-gap", nv.group + "px");
    if (lista.scrollHeight <= lista.clientHeight + 1) return true;
  }
  return false;
}

async function cargar() {
  $("avisos").innerHTML = "";
  $("info").textContent = "Cargando platos…";
  let texto;
  try {
    const r = await fetch(SHEET_CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    texto = await r.text();
  } catch (e) {
    $("info").textContent = "";
    avisar("No se ha podido leer el Google Sheet (" + e.message + "). Comprueba la conexión y que la hoja sigue publicada como CSV.", true);
    return;
  }
  const filas = parseCSV(texto);
  const cab = (filas.shift() || []).map(normal);
  const col = (nombre) => cab.indexOf(normal(nombre));
  const iCat = col("Categoría"), iNom = col("Nombre"), iDes = col("Descripción"), iPre = col("Precio"), iFam = col("Familia");
  if (iCat < 0 || iNom < 0) { avisar("El Sheet no tiene las columnas 'Categoría' y 'Nombre'.", true); return; }

  const deducidas = [], desconocidas = [];
  const platos = filas
    .filter((f) => normal(f[iCat]) === "hoy tenemos" && String(f[iNom] ?? "").trim())
    .map((f) => {
      const nombre = String(f[iNom]).trim().replace(/\s+/g, " ");
      const descripcion = iDes >= 0 ? String(f[iDes] ?? "").trim().replace(/\s+/g, " ") : "";
      const fam = familiaDe(iFam >= 0 ? f[iFam] : "", nombre, descripcion);
      if (fam.deducida) deducidas.push(nombre);
      if (fam.desconocida) desconocidas.push(nombre + " (" + fam.valor + ")");
      return { nombre, descripcion, precio: precio(iPre >= 0 ? f[iPre] : ""), familia: fam.id || "antipasti" };
    });

  pintar(platos);
  await document.fonts.ready;
  const cabe = ajustar();

  $("info").textContent = platos.length + (platos.length === 1 ? " plato" : " platos");
  if (platos.length > MAX_PLATOS) avisar("Hay " + platos.length + " platos. El diseño está pensado para " + MAX_PLATOS + " como máximo.", false);
  if (!cabe) avisar("No cabe todo en el A5: acorta descripciones o quita algún plato en el Sheet. Este aviso no se imprime.", true);
  if (iFam < 0 && platos.length) avisar("Falta la columna 'Familia' en el Sheet: las familias se han deducido por el nombre. Revisa que cada plato esté en su sitio.", false);
  else if (deducidas.length) avisar("Sin familia en el Sheet (deducida): " + deducidas.join(", ") + ".", false);
  if (desconocidas.length) avisar("Familia no reconocida, puesta en Antipasti: " + desconocidas.join(", ") + ". Usa Antipasti, Piadina, Pasta, Pizza o Postre.", true);
  const sinPrecio = platos.filter((p) => !p.precio).map((p) => p.nombre);
  if (sinPrecio.length) avisar("Sin precio: " + sinPrecio.join(", ") + ".", true);
}

$("imprimir").addEventListener("click", () => window.print());
