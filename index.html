<style>
:root {
  --bg: #ededda;
  --ink: #14170f;
  --muted: #4a4a3c;
  --line: #d6d6c2;
  --green: #2ddd0e;
  --white: #ffffff;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: Barlow, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--body); }
.wrap { max-width: 620px; margin: 0 auto; padding: 0 16px; }

/* Cabecera */
header { padding: 26px 0 14px; text-align: center; }
header img { width: 168px; height: auto; display: block; margin: 0 auto; }
header .tag { margin-top: 8px; font: 500 15px/1.2 var(--body); color: var(--muted); }
.langs { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
.langs button { font: 700 15px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink);
  background: transparent; color: var(--ink); padding: 7px 10px 6px; border-radius: 999px; cursor: pointer; min-width: 44px; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--green); }

/* Barra de secciones */
nav.chips { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 2px solid var(--ink); }
nav.chips .wrap { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
nav.chips .wrap::-webkit-scrollbar { display: none; }
nav.chips a { flex: none; font: 700 15px/1 var(--cond); letter-spacing: .05em; text-transform: uppercase; text-decoration: none;
  color: var(--ink); padding: 8px 11px 7px; border-radius: 999px; background: var(--white); }
nav.chips a.hoy { background: var(--green); }
nav.chips a.on { background: var(--ink); color: var(--green); }

/* Filtro de alérgenos */
.filter { margin: 14px 0 4px; }
.filter > button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font: 700 16px/1 var(--cond); letter-spacing: .05em; text-transform: uppercase; background: transparent; color: var(--ink);
  border: 2px solid var(--ink); border-radius: 10px; padding: 11px 14px 10px; cursor: pointer; }
.filter > button .count { background: var(--ink); color: var(--green); border-radius: 999px; padding: 3px 8px 2px; font-size: 14px; }
.filter .panel { display: none; padding: 12px 2px 4px; }
.filter.open .panel { display: block; }
.filter .hint { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { font: 500 14px/1 var(--body); border: 1.5px solid var(--ink); background: var(--white); color: var(--ink);
  border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--white); text-decoration: line-through; text-decoration-color: var(--green); text-decoration-thickness: 2px; }
.filter .clear { margin-top: 10px; background: none; border: 0; font: 600 14px var(--body); text-decoration: underline; color: var(--ink); cursor: pointer; }
.hidden-note { font-size: 14px; color: var(--muted); margin-top: 8px; }

/* Avisos */
.notice { margin: 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--white); border-left: 4px solid var(--ink); font-size: 14px; }
.loading { text-align: center; padding: 40px 0; font: 700 18px var(--cond); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

/* Bloques Mangiare / Bere */
.big { margin: 34px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  border-bottom: 3px solid var(--ink); padding-bottom: 6px; }
.big h2 { font: 800 46px/0.9 var(--cond); letter-spacing: .01em; text-transform: uppercase; }
.big p { font: 500 15px/1.2 var(--body); color: var(--muted); }

/* Secciones */
section.cat { padding-top: 26px; scroll-margin-top: 60px; }
.cat-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.cat-head h3 { font: 800 30px/1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.cat-head h3 .hl { background: linear-gradient(transparent 58%, var(--green) 58%); padding: 0 2px; }
.cat-head .sub { font: italic 400 15px/1.2 var(--body); color: var(--muted); }
.cat-note { font-size: 15px; margin: -2px 0 12px; }

.item { padding: 11px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.row { display: flex; align-items: baseline; gap: 10px; }
.name { flex: 1; font: 700 19px/1.15 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
.name .x { font: 500 14px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: 4px; }
.price { font: 700 19px/1.15 var(--cond); white-space: nowrap; }
.icons { display: inline-flex; gap: 3px; vertical-align: -2px; margin-left: 5px; }
.icons svg { width: 17px; height: 17px; }
.desc { font-size: 15px; color: var(--muted); margin-top: 2px; }
.extra { font-size: 14px; margin-top: 3px; }
.alg { font-size: 12.5px; color: var(--muted); margin-top: 5px; letter-spacing: .01em; }
.alg b { font-weight: 600; }
.alg.rev { font-style: italic; }

/* Recomendado */
.item.rec { background: var(--ink); color: var(--white); border-radius: 12px; padding: 14px 14px 13px; margin: 6px 0; border: 0; }
.item.rec .desc, .item.rec .alg, .item.rec .name .x { color: #c9c9b4; }
.pill { display: inline-block; background: var(--green); color: var(--ink); font: 700 13px/1 var(--cond); letter-spacing: .06em;
  text-transform: uppercase; padding: 5px 9px 4px; border-radius: 8px; line-height: 1.15; margin-bottom: 7px; }

/* Panel pizza (negro) */
section.dark { background: var(--ink); color: var(--white); border-radius: 16px; padding: 20px 16px 10px; margin-top: 26px; }
section.dark .cat-head .sub, section.dark .desc, section.dark .alg, section.dark .cat-note { color: #c9c9b4; }
section.dark .cat-head h3 .hl { color: var(--white); }
section.dark .item { border-color: #3a3d32; }
section.dark .item.rec { background: var(--green); color: var(--ink); }
section.dark .item.rec .desc, section.dark .item.rec .alg { color: var(--ink); }
section.dark .item.rec .pill { background: var(--ink); color: var(--green); }

/* Panel cócteles (verde) */
section.lime { background: var(--green); border-radius: 16px; padding: 20px 16px 10px; margin-top: 26px; }
section.lime .cat-head .sub { color: var(--ink); font-style: normal; font-weight: 600; }
section.lime .cat-head h3 .hl { background: none; }
section.lime .desc, section.lime .alg { color: var(--ink); }
section.lime .item { border-color: rgba(20,23,15,.25); }
section.lime .item.rec .pill { background: var(--green); }
section.lime .item.rec .desc, section.lime .item.rec .alg { color: #c9c9b4; }

/* Vinos */
.wine-type { display: grid; grid-template-columns: 1fr 46px 72px; gap: 6px; align-items: baseline; margin: 18px 0 2px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
.wine-type b { font: 800 20px/1 var(--cond); text-transform: uppercase; letter-spacing: .04em; }
.wine-type span { font: 700 12px/1 var(--cond); letter-spacing: .02em; white-space: nowrap; text-transform: uppercase; color: var(--muted); text-align: right; }
.wine .p { text-align: right; }
.wine { display: grid; grid-template-columns: 1fr 46px 72px; gap: 6px; align-items: baseline; }
.wine .p { font: 700 18px/1.1 var(--cond); }
.wine .p.na { color: var(--muted); font-weight: 600; }
.item.rec .wine .p.na { color: #c9c9b4; }
.sal { display: inline-block; font: 700 12px/1 var(--cond); letter-spacing: .05em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 6px 2px; margin-left: 6px; vertical-align: 2px; }

/* Pie */
footer { margin: 34px 0 0; padding: 22px 0 calc(28px + env(safe-area-inset-bottom)); border-top: 3px solid var(--ink); font-size: 14px; color: var(--muted); }
footer p { margin-bottom: 7px; }
footer .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink); margin-bottom: 12px; font-weight: 500; }
footer .legend span { display: inline-flex; align-items: center; gap: 5px; }
footer .legend svg { width: 17px; height: 17px; }
footer .allergy { color: var(--ink); font-weight: 600; }
.empty { padding: 12px 0; color: var(--muted); font-size: 15px; }
</style>
</head>

const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim().replace(/\s+/g, " ");
const key = (s) => norm(s).replace(/ /g, "_");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const yes = (v) => ["x","si","1","true","verdadero","yes"].includes(norm(v));

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function num(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim().replace("€", "").replace(",", ".");
  if (s === "" || s === "-" || s === "—") return null;
  const n = Number(s);
  return isFinite(n) ? n : String(v).trim();
}
function money(v, oneDecimal) {
  if (v === null || v === undefined || v === "") return "";
  const sep = lang === "en" ? "." : ",";
  if (typeof v === "string") return v.replace(/[.,]/g, sep);
  let s = oneDecimal ? v.toFixed(1) : (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100));
  return s.replace(".", sep);
}

function sectionOf(cat) {
  const c = norm(cat);
  for (const s of SECTIONS) if (s.match.includes(c)) return s.id;
  for (const s of SECTIONS) if (s.match.some((m) => c.startsWith(m))) return s.id;
  return "otros:" + String(cat).trim();
}
function familyOf(v, nombre, desc) {
  const f = norm(v);
  const hit = HOY_FAM.find((x) => f.startsWith(x.slice(0, 4)));
  if (hit) return hit;
  const s = norm(nombre + " " + desc);
  if (/pizza|calzone/.test(s)) return "pizza";
  if (/piadina|sandwich/.test(s)) return "piadina";
  if (/tarta|helado|gelato|tiramis|cremoso|bizcocho|postre|dulce|ricotta con|arroz con leche/.test(s)) return "postre";
  if (/pasta|spaghetti|rigatoni|tagliatel|gnocchi|ravioli|canelon|lasan|risotto|orecchiette|caramell/.test(s)) return "pasta";
  return "antipasti";
}

function toItems(objs) {
  const out = [];
  objs.forEach((o, idx) => {
    const g = (h) => (o[h] ?? "").toString().trim();
    const nombre = g("nombre");
    const cat = g("categoria");
    if (!nombre || !cat) return;
    const tr = {};
    for (const l of LANGS.slice(1)) {
      const L = l;
      tr[l] = { nombre: g("nombre_" + L), desc: g("descripcion_" + L), extra: g("extra_" + L), etiq: g("etiqueta_" + L) };
    }
    out.push({
      i: idx, sec: sectionOf(cat), cat, nombre, desc: g("descripcion"), extra: g("extra"), etiq: g("etiqueta"),
      precio: num(g("precio")), copa: num(g("copa")),
      rec: yes(g("recomendado")), veg: yes(g("vegetariano")), pic: yes(g("picante")),
      tipo: norm(g("tipo")), fam: familyOf(g("familia"), nombre, g("descripcion")),
      rev: yes(g("revisar_alergenos")),
      alg: ALG.filter((a) => yes(g(a))), tr
    });
  });
  return out;
}
function rowsToObjs(rows) {
  const head = rows[0].map(key);
  return rows.slice(1).map((r) => { const o = {}; head.forEach((h, i) => { if (h && !(h in o)) o[h] = r[i]; }); return o; });
}
function fallbackObjs() {
  return FALLBACK.map((r) => { const o = {}; for (const k in r) o[key(k)] = r[k] === null ? "" : String(r[k]); return o; });
}

/* Texto traducido con vuelta al español */
function tx(it, field) {
  if (lang !== "es") { const v = it.tr[lang] && it.tr[lang][field]; if (v) return v; }
  return it[field];
}
function untranslated(it) { return lang !== "es" && it.desc && !(it.tr[lang] && it.tr[lang].desc); }

/* ─── Render ─── */
function icons(it) {
  let s = "";
  if (it.veg) s += `<span title="${esc(t(T.veg))}">${ICON.veg}</span>`;
  if (it.pic) s += `<span title="${esc(t(T.pic))}">${ICON.pic}</span>`;
  return s ? `<span class="icons">${s}</span>` : "";
}
function algLine(it) {
  if (it.rev) return `<p class="alg rev">${esc(t(T.review))}</p>`;
  if (!it.alg.length) return `<p class="alg">${esc(t(T.noalg))}</p>`;
  return `<p class="alg"><b>${esc(t(T.contains))}:</b> ${it.alg.map((a) => esc(ALG_NAME[a][li])).join(" · ")}</p>`;
}
function visible(it) {
  if (!off.size) return true;
  if (it.rev) return false;
  return !it.alg.some((a) => off.has(a));
}
function pillHtml(it) {
  if (!it.rec) return "";
  const e = tx(it, "etiq");
  return `<span class="pill">${esc(t(T.rec))}${e && !/salamanca/i.test(it.etiq) ? " · " + esc(e) : ""}</span><br>`;
}
function salHtml(it) {
  return it.etiq && /salamanca/i.test(it.etiq) ? `<span class="sal">${esc(tx(it, "etiq"))}</span>` : "";
}
function itemHtml(it, opts = {}) {
  const extra = tx(it, "extra");
  const inlineExtra = opts.inlineExtra && extra;
  return `<article class="item${it.rec ? " rec" : ""}">${pillHtml(it)}
    <div class="row"><h4 class="name">${esc(tx(it, "nombre"))}${inlineExtra ? `<span class="x">${esc(extra)}</span>` : ""}${icons(it)}${salHtml(it)}</h4>
    ${opts.noPrice ? "" : `<span class="price">${money(it.precio, opts.oneDecimal)}</span>`}</div>
    ${tx(it, "desc") ? `<p class="desc">${esc(tx(it, "desc"))}</p>` : ""}
    ${extra && !inlineExtra ? `<p class="extra">${esc(extra)}</p>` : ""}
    ${algLine(it)}</article>`;
}
function wineHtml(it) {
  return `<article class="item${it.rec ? " rec" : ""}">${pillHtml(it)}
    <div class="wine"><h4 class="name">${esc(tx(it, "nombre"))}${salHtml(it)}</h4>
      <span class="p${it.copa === null ? " na" : ""}">${it.copa === null ? "—" : money(it.copa, true)}</span>
      <span class="p">${money(it.precio)}</span></div>
    ${tx(it, "desc") ? `<p class="desc">${esc(tx(it, "desc"))}</p>` : ""}
    ${algLine(it)}</article>`;
}
function head(sec, extraSub) {
  const sub = extraSub || t(sec.sub);
  return `<div class="cat-head"><h3><span class="hl">${esc(t(sec.title))}</span></h3>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</div>`;
}

function render() {
  document.documentElement.lang = lang;
  li = LANGS.indexOf(lang);
  document.getElementById("tagline").textContent = t(T.tagline);
  document.getElementById("langs").innerHTML = LANGS.map((l) =>
    `<button type="button" data-l="${l}" aria-pressed="${l === lang}">${l}</button>`).join("");
  renderFilter();

  const groups = {};
  ITEMS.forEach((it) => (groups[it.sec] = groups[it.sec] || []).push(it));
  const order = SECTIONS.map((s) => s.id).concat(Object.keys(groups).filter((k) => k.startsWith("otros:")));
  let html = "", nav = "", hiddenCount = 0;

  for (const id of order) {
    const all = groups[id];
    if (!all || !all.length) continue;
    const sec = SECTIONS.find((s) => s.id === id) || { id, title: [id.slice(6)], sub: null };
    const list = all.filter(visible);
    hiddenCount += all.length - list.length;
    if (sec.block === "mangiare") html += `<div class="big"><h2>Mangiare</h2></div>`;
    if (sec.block === "bere") html += `<div class="big"><h2>Bere</h2><p>${esc(t(T.bere))}</p></div>`;
    const anchor = "s-" + key(id);
    nav += `<a href="#${anchor}" class="${id === "hoy" ? "hoy" : ""}">${esc(t(sec.title))}</a>`;

    let body = "", subOverride = "";
    if (!list.length) body = `<p class="empty">${esc(t(T.empty))}</p>`;
    else if (id === "hoy") {
      const sorted = list.slice().sort((a, b) => HOY_FAM.indexOf(a.fam) - HOY_FAM.indexOf(b.fam) || a.i - b.i);
      if (sorted.some(untranslated)) body += `<p class="cat-note">${esc(t(T.hoyEs))}</p>`;
      body += sorted.map((it) => itemHtml(it)).join("");
    } else if (id === "cocteles") {
      const prices = [...new Set(all.map((x) => x.precio))];
      const same = prices.length === 1 && prices[0] !== null;
      if (same) subOverride = t(T.allAt) + " " + money(prices[0]);
      body = list.map((it) => itemHtml(it, { noPrice: same })).join("");
    } else if (id === "vinos") {
      body = "";
      const wt = (name) => `<p class="wine-type"><b>${name}</b><span>${esc(t(T.copa))}</span><span>${esc(t(T.bot))}</span></p>`;
      const known = WINE_TYPES.map((w) => ({ w, items: list.filter((x) => w.m.includes(x.tipo)) }));
      const rest = list.filter((x) => !WINE_TYPES.some((w) => w.m.includes(x.tipo)));
      for (const g of known) if (g.items.length) body += wt(esc(t(g.w.t))) + g.items.map(wineHtml).join("");
      if (rest.length) body += wt("&nbsp;") + rest.map(wineHtml).join("");
    } else if (id === "cervezas") {
      body = list.map((it) => itemHtml(it, { oneDecimal: true, inlineExtra: true })).join("");
    } else {
      if (sec.note) body += `<p class="cat-note">${esc(t(sec.note))}</p>`;
      body += list.map((it) => itemHtml(it)).join("");
    }
    html += `<section class="cat ${sec.style || ""}" id="${anchor}">${head(sec, subOverride)}${body}</section>`;
  }

  document.getElementById("menu").innerHTML = html || `<p class="loading">—</p>`;
  document.getElementById("navInner").innerHTML = nav;
  const hn = document.getElementById("hiddenNote");
  hn.hidden = !off.size;
  hn.textContent = hiddenCount + " " + t(T.hidden);
  document.getElementById("notice").innerHTML = usingFallback ? `<p class="notice">${esc(t(T.offline))}</p>` : "";
  document.getElementById("footer").innerHTML = `
    <div class="legend"><span>${ICON.veg} ${esc(t(T.veg))}</span><span>${ICON.pic} ${esc(t(T.pic))}</span></div>
    <p class="allergy">${esc(t(T.allergy))}</p>
    <p>${esc(t(T.local))}</p><p>${esc(t(T.iva))}</p><p>${esc(t(T.alcohol))}</p>
    <p>Biga Trattoria Moderna · Salamanca</p>`;
  spy();
}

function renderFilter() {
  const f = document.getElementById("filter");
  document.getElementById("filterBtn").innerHTML = `<span>${esc(t(T.filter))}</span>${off.size ? `<span class="count">${off.size}</span>` : `<span aria-hidden="true">${f.classList.contains("open") ? "−" : "+"}</span>`}`;
  document.getElementById("filterHint").textContent = t(T.hint);
  document.getElementById("clearBtn").textContent = t(T.clear);
  document.getElementById("clearBtn").hidden = !off.size;
  document.getElementById("pills").innerHTML = ALG.map((a) =>
    `<button type="button" data-a="${a}" aria-pressed="${off.has(a)}">${esc(ALG_NAME[a][li])}</button>`).join("");
}

/* Resalta en la barra la sección visible */
let observer;
function spy() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const links = [...document.querySelectorAll("#navInner a")];
  observer = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      links.forEach((a) => {
        const on = a.getAttribute("href") === "#" + e.target.id;
        a.classList.toggle("on", on);
        if (on) { const w = a.parentElement; w.scrollTo({ left: a.offsetLeft - w.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" }); }
      });
    });
  }, { rootMargin: "-60px 0px -70% 0px" });
  document.querySelectorAll("section.cat").forEach((s) => observer.observe(s));
}

/* ─── Eventos ─── */
document.addEventListener("click", (e) => {
  const lb = e.target.closest("[data-l]");
  if (lb) { lang = lb.dataset.l; try { localStorage.setItem("biga-lang", lang); } catch (_) {} render(); return; }
  const ab = e.target.closest("[data-a]");
  if (ab) { const a = ab.dataset.a; off.has(a) ? off.delete(a) : off.add(a); render(); return; }
  if (e.target.closest("#filterBtn")) {
    const f = document.getElementById("filter"); f.classList.toggle("open");
    document.getElementById("filterBtn").setAttribute("aria-expanded", f.classList.contains("open")); renderFilter(); return;
  }
  if (e.target.closest("#clearBtn")) { off.clear(); render(); }
});

/* ─── Arranque ─── */
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("biga-lang"); if (s && LANGS.includes(s)) return s; } catch (_) {}
  const n = (navigator.language || "es").slice(0, 2).toLowerCase();
  return LANGS.includes(n) ? n : (n === "es" || n === "ca" || n === "gl" || n === "eu" ? "es" : "en");
}
async function init() {
  lang = pickLang(); li = LANGS.indexOf(lang);
  try {
    const url = window.BIGA_CSV || (SHEET_CSV_URL + "&t=" + Date.now());
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = parseCSV(await r.text()).filter((x) => x.some((c) => c.trim() !== ""));
    if (rows.length < 2 || !rows[0].map(key).includes("nombre")) throw new Error("CSV sin cabeceras");
    ITEMS = toItems(rowsToObjs(rows));
    if (!ITEMS.length) throw new Error("CSV vacío");
  } catch (err) {
    console.warn("Biga: usando carta guardada →", err);
    ITEMS = toItems(fallbackObjs());
    usingFallback = true;
  }
  render();
}
init();
</script>
